    const uiState = {
      tenantKey: 'imobiliaria',

    function currentTenant() { return TENANTS[uiState.tenantKey]; }

    function resetSimulator() {
      const t = currentTenant();
      const firstCus = t.customers[0]?.id || 'unknown';
      if (uiState.simProfile !== 'unknown' && !t.customers.some(c => c.id === uiState.simProfile)) {
        uiState.simProfile = firstCus;
      }
      uiState.sim = {
        state: 'IDLE',
        authenticatedCustomerId: null,
        failedAttempts: 0,
        locked: false,
        pendingIntentId: null,
        pendingRecords: [],
        publicPage: 0,
        messages: [],
        logs: []
      };
      addAuditLog('SESSION_INIT', `tenant=${t.id} state=IDLE pii=REDACTED`);
      simReceiveUser('Olá', 'TEXT', null, true);
    }

    function addAuditLog(code, meta) {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      uiState.sim.logs.unshift({ ts: `${hh}:${mm}:${ss}`, code, meta });
      if (uiState.sim.logs.length > 14) uiState.sim.logs.pop();
    }

    function renderSafeTemplate(template, ctx) {
      return template.replace(/\{\{(comercio|cliente|registro|colecao)\.([a-z0-9_]+)\}\}/g, (_, scope, key) => {
        if (scope === 'comercio') return ctx.tenant.globals[key] ?? 'não informado';
        if (scope === 'cliente') return ctx.customer ? (ctx.customer[key] ?? 'não informado') : 'visitante';
        if (scope === 'colecao') return ctx.collection ? (key === 'atualizado_em' ? ctx.collection.lastSynced : 'não informado') : 'não informado';
        if (scope === 'registro' && ctx.record) {
          const val = ctx.record.data[key];
          if (val === null || val === undefined || val === '') return 'não informado';
          const fieldDef = ctx.collection?.fields.find(f => f.key === key);
          if (fieldDef?.type === 'currency_brl') return formatBRL(val);
          return String(val);
        }
        return 'não informado';
      });
    }

    // =========================================================================
    // MOTOR DETERMINÍSTICO DO SIMULADOR
    // =========================================================================
    function simPushBot(text, buttons = [], footer = '') {
      uiState.sim.messages.push({ from: 'bot', text, buttons, footer });
    }

    function simMenuButtons(tenant) {
      return tenant.intents.map(i => ({
        id: `intent:${i.id}`,
        label: i.title,
        tag: i.visibility === 'PRIVATE' ? '🔒' : ''
      }));
    }

    function simSendMenu(greetingPrefix) {
      const t = currentTenant();
      uiState.sim.state = 'MENU_OPEN';
      uiState.sim.pendingIntentId = null;
      uiState.sim.pendingRecords = [];
      simPushBot(
        `${greetingPrefix}Olá! Bem-vindo ao autoatendimento da ${t.name}.\nComo posso ajudar você hoje?`,
        simMenuButtons(t),
        'Toque em uma opção abaixo'
      );
    }

    function simExecuteIntent(intent) {
      const t = currentTenant();
      addAuditLog('INTENT_MATCH', `intent=${intent.code} visibility=${intent.visibility}`);

      if (intent.actionType === 'HUMAN_HANDOFF') {
        uiState.sim.state = 'HANDOFF_HUMAN';
        const msg = renderSafeTemplate(intent.template, { tenant: t });
        simPushBot(msg, [{ id: 'sys:resume', label: 'Voltar ao autoatendimento' }], 'Robô pausado para atendimento humano');
        addAuditLog('HANDOFF_OPENED', `tenant=${t.id} bot_paused=true`);
        return;
      }

      if (intent.visibility === 'PUBLIC') {
        if (intent.actionType === 'STATIC_MESSAGE') {
          uiState.sim.state = 'PUBLIC_RESULT';
          const msg = renderSafeTemplate(intent.template, { tenant: t });
          simPushBot(msg, [{ id: 'sys:menu', label: 'Voltar ao início' }]);
          return;
        }
        if (intent.actionType === 'PUBLIC_CATALOG_LIST') {
          const col = t.collections.find(c => c.id === intent.collectionId);
          uiState.sim.state = 'PUBLIC_RESULT';
          const pageSize = 2;
          const start = uiState.sim.publicPage * pageSize;
          const slice = col.records.slice(start, start + pageSize);
          const lines = slice.map(r => renderSafeTemplate(intent.template, { tenant: t, collection: col, record: r }));
          const btns = [];
          if (start + pageSize < col.records.length) {
            btns.push({ id: `sys:next_pub:${intent.id}`, label: `Ver mais opções (${col.records.length - (start + pageSize)})` });
          }
          btns.push({ id: 'sys:menu', label: 'Voltar ao início' });
          simPushBot(`${col.name}:\n\n${lines.join('\n')}`, btns, `Atualizado: ${col.lastSynced}`);
          return;
        }
      }

      const customer = t.customers.find(c => c.id === uiState.simProfile);
      if (!customer) {
        uiState.sim.state = 'HANDOFF_HUMAN';
        addAuditLog('AUTH_DENIED_UNREGISTERED', `tenant=${t.id} phone_match=false pii=REDACTED`);
        simPushBot(
          `Este número de WhatsApp ainda não está vinculado a um cadastro na ${t.name}.\n\nPara proteger seus dados (LGPD), não informamos valores apenas pelo CPF em números desconhecidos.`,
          [
            { id: `intent:${t.intents.find(i => i.actionType === 'HUMAN_HANDOFF').id}`, label: 'Falar com atendente' },
            { id: 'sys:menu', label: 'Ver opções públicas' }
          ],
          'Proteção de privacidade ativa'
        );
        return;
      }

      if (uiState.sim.locked) {
        uiState.sim.state = 'AUTH_LOCKED';
        simPushBot('Acesso privado bloqueado temporariamente após 3 tentativas incorretas. Aguarde 15 minutos ou fale com nossa equipe.', [
          { id: 'sys:menu', label: 'Voltar ao início' }
        ]);
        return;
      }

      if (uiState.sim.authenticatedCustomerId !== customer.id) {
        uiState.sim.state = 'AUTH_CHALLENGE';
        uiState.sim.pendingIntentId = intent.id;
        addAuditLog('AUTH_CHALLENGE_SENT', `tenant=${t.id} customer=${customer.id} factor=CPF_LAST4`);
        simPushBot(
          `Olá, ${customer.name.split(' ')[0]}! Reconheci seu número.\n\nPara confirmar sua identidade, digite os ${t.authHint}:`,
          [
            { id: `sys:quick_auth:${customer.cpfLast4}`, label: `Testar com 1 toque: enviar ${customer.cpfLast4}` },
            { id: 'sys:menu', label: 'Cancelar' }
          ],
          'Confirmação rápida de segurança'
        );
        return;
      }

      const col = t.collections.find(c => c.id === intent.collectionId);
      const owned = col.records.filter(r => r.customerId === customer.id);
      addAuditLog('PRIVATE_QUERY', `tenant=${t.id} col=${col.slug} customer=${customer.id} rows=${owned.length}`);

      if (owned.length === 0) {
        uiState.sim.state = 'PRIVATE_RESULT';
        simPushBot('Não encontramos nenhum registro ativo vinculado ao seu cadastro no momento.', [{ id: 'sys:menu', label: 'Voltar ao início' }]);
        return;
      }

      if (owned.length === 1) {
        uiState.sim.state = 'PRIVATE_RESULT';
        const text = renderSafeTemplate(intent.template, { tenant: t, customer: { nome: customer.name }, collection: col, record: owned[0] });
        simPushBot(text, [{ id: 'sys:menu', label: 'Voltar ao início' }], `Atualizado: ${col.lastSynced}`);
        return;
      }

      uiState.sim.state = 'RECORD_SELECTION';
      uiState.sim.pendingIntentId = intent.id;
      uiState.sim.pendingRecords = owned;
      const listBtns = owned.map((r, idx) => ({ id: `rec:${idx}`, label: String(r.data[col.titleField]) }));
      listBtns.push({ id: 'sys:menu', label: 'Voltar ao início' });
      simPushBot(`Você possui ${owned.length} cadastros ativos conosco. Qual deles deseja consultar?`, listBtns);
    }

    function simReceiveUser(displayText, kind = 'TEXT', selectedId = null, silent = false) {
      const t = currentTenant();
      if (selectedId && selectedId.startsWith('sys:quick_auth:')) {
        const code = selectedId.replace('sys:quick_auth:', '');
        simReceiveUser(code, 'TEXT', null, false);
        return;
      }

      if (!silent) {
        uiState.sim.messages.push({ from: 'user', text: displayText });
      }

      if (kind === 'UNSUPPORTED_MEDIA') {
        addAuditLog('UNSUPPORTED_MEDIA', `tenant=${t.id} kind=AUDIO`);
        simPushBot('Por aqui consigo responder rapidinho quando você toca nos botões abaixo:', simMenuButtons(t));
        return;
      }

      const norm = String(displayText || '').trim().toLowerCase();

      if (selectedId === 'sys:menu' || selectedId === 'sys:resume' || norm === 'menu') {
        uiState.sim.publicPage = 0;
        simSendMenu('');
        return;
      }

      if (selectedId && selectedId.startsWith('sys:next_pub:')) {
        const intentId = selectedId.replace('sys:next_pub:', '');
        uiState.sim.publicPage += 1;
        const intent = t.intents.find(i => i.id === intentId);
        if (intent) simExecuteIntent(intent);
        return;
      }

      if (uiState.sim.state === 'HANDOFF_HUMAN') {
        addAuditLog('HANDOFF_PASS_THROUGH', `tenant=${t.id} bot_ignored=true`);
        simPushBot('(Robô em pausa — sua mensagem foi entregue para o atendente humano.)', [{ id: 'sys:resume', label: 'Reativar robô (teste)' }]);
        return;
      }

      if (uiState.sim.state === 'AUTH_CHALLENGE' && !selectedId) {
        const customer = t.customers.find(c => c.id === uiState.simProfile);
        if (customer && norm === customer.cpfLast4) {
          uiState.sim.authenticatedCustomerId = customer.id;
          uiState.sim.failedAttempts = 0;
          addAuditLog('AUTH_SUCCESS', `tenant=${t.id} customer=${customer.id} ttl=30m`);
          const pending = t.intents.find(i => i.id === uiState.sim.pendingIntentId);
          if (pending) simExecuteIntent(pending);
        } else {
          uiState.sim.failedAttempts += 1;
          addAuditLog('AUTH_FAILED', `tenant=${t.id} attempt=${uiState.sim.failedAttempts}/3 pii=REDACTED`);
          if (uiState.sim.failedAttempts >= 3) {
            uiState.sim.locked = true;
            uiState.sim.state = 'AUTH_LOCKED';
            simPushBot('Por segurança, bloqueamos novas tentativas por 15 minutos após 3 erros.', [
              { id: 'sys:menu', label: 'Voltar ao início' },
              { id: `intent:${t.intents.find(i => i.actionType === 'HUMAN_HANDOFF').id}`, label: 'Falar com atendente' }
            ]);
          } else {
            simPushBot(`Código não confere (tentativa ${uiState.sim.failedAttempts} de 3). Digite os ${t.authHint}:`, [
              { id: `sys:quick_auth:${customer ? customer.cpfLast4 : '7735'}`, label: `Testar código correto (${customer ? customer.cpfLast4 : '7735'})` },
              { id: 'sys:menu', label: 'Cancelar' }
            ]);
          }
        }
        return;
      }

      if (uiState.sim.state === 'RECORD_SELECTION' && selectedId && selectedId.startsWith('rec:')) {
        const idx = Number(selectedId.replace('rec:', ''));
        const rec = uiState.sim.pendingRecords[idx];
        const intent = t.intents.find(i => i.id === uiState.sim.pendingIntentId);
        const customer = t.customers.find(c => c.id === uiState.sim.authenticatedCustomerId);
        const col = t.collections.find(c => c.id === intent.collectionId);
        if (rec && intent && customer && rec.customerId === customer.id) {
          uiState.sim.state = 'PRIVATE_RESULT';
          const text = renderSafeTemplate(intent.template, { tenant: t, customer: { nome: customer.name }, collection: col, record: rec });
          simPushBot(text, [{ id: 'sys:menu', label: 'Voltar ao início' }], `Atualizado: ${col.lastSynced}`);
          addAuditLog('RECORD_RENDERED', `tenant=${t.id} col=${col.slug} record=${rec.id} pii=REDACTED`);
        }
        return;
      }

      if (selectedId && selectedId.startsWith('intent:')) {
        const intentId = selectedId.replace('intent:', '');
        const intent = t.intents.find(i => i.id === intentId);
        uiState.sim.publicPage = 0;
        if (intent) { simExecuteIntent(intent); return; }
      }

      const kwMatch = t.intents.find(i => i.keywords.some(k => norm === k));
      if (kwMatch) {
        uiState.sim.publicPage = 0;
        simExecuteIntent(kwMatch);
        return;
      }

      simSendMenu('');
    }

    function updateIntentField(field, value) {

      const intent = t.intents.find(i => i.id === uiState.selectedIntentId);

      intent[field] = value;
      render();
      const area = document.getElementById('tplArea');
      if (field === 'template' && area) {
        area.focus();
        area.setSelectionRange(value.length, value.length);
      }

            ` : `
              <div class="space-y-3">
                ${t.handoffs.map(h => `
                  <div class="apple-subcard p-4 flex flex-wrap items-center justify-between gap-3">
                    <div class="space-y-1 text-xs">
                      <div class="font-semibold">${escapeHtml(h.phoneMasked)} <span class="font-normal text-[var(--muted-foreground)]">· ${escapeHtml(h.since)}</span></div>
                      <div class="text-[var(--muted-foreground)]">${escapeHtml(h.reason)}</div>
                    </div>
                    <button type="button" onclick="resolveHandoff('${h.id}')" class="apple-btn-primary text-xs px-4 py-2">
                      Concluir e reativar robô
                    </button>
                  </div>
                `).join('')}
              </div>
            `}
          </div>

          <div data-component="ChannelConfigCard (Novo)" class="xl:col-span-5 apple-card p-5 sm:p-6 space-y-4">
            <span class="comp-tag">ChannelConfigCard · Novo</span>
            <div class="flex items-center justify-between">
              <h2 class="text-base font-semibold apple-title">Dados gerais do comércio</h2>
              <span class="text-xs px-2.5 py-0.5 rounded-full soft-primary font-medium">Ativo</span>
            </div>

            <div class="space-y-2.5 text-xs">
              <div class="apple-subcard p-3.5 flex justify-between gap-2">
                <span class="text-[var(--muted-foreground)]">Chave Pix oficial</span>
                <span class="font-mono font-semibold truncate">${escapeHtml(t.globals.chave_pix)}</span>
              </div>
              <div class="apple-subcard p-3.5 flex justify-between gap-2">
                <span class="text-[var(--muted-foreground)]">Horário de atendimento</span>
                <span class="font-semibold">${escapeHtml(t.globals.horario_atendimento)}</span>
              </div>
              <div class="apple-subcard p-3.5 flex justify-between gap-2">
                <span class="text-[var(--muted-foreground)]">Confirmação de segurança</span>
                <span class="font-semibold">${escapeHtml(t.authHint)}</span>
              </div>
              <div class="apple-subcard p-3.5 flex justify-between gap-2">
                <span class="text-[var(--muted-foreground)]">Duração do acesso confirmado</span>
                <span class="font-semibold">${t.sessionTtlMin} minutos</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function resolveHandoff(id) {
      const t = currentTenant();
      t.handoffs = t.handoffs.filter(h => h.id !== id);
      showToast('Atendimento automático reativado para este cliente.');
      render();
    }

    // =========================================================================
    // NAVEGAÇÃO E EVENTOS
    // =========================================================================
    const VIEW_META = {
      dashboard:   { title: 'Início', subtitle: 'Resumo do seu autoatendimento e acesso rápido às configurações.' },
      collections: { title: 'Cadastros e Tabelas', subtitle: 'Seus clientes e as tabelas que alimentam as respostas automáticas.' },
      intents:     { title: 'Respostas do WhatsApp', subtitle: 'Personalize os botões do menu e veja como a mensagem fica no iPhone.' },
      simulator:   { title: 'Testar no iPhone', subtitle: 'Simule a experiência real do seu cliente antes de ativar.' },
      handoff:     { title: 'Atendimento Humano', subtitle: 'Conversas onde o robô foi pausado para sua equipe responder.' }
    };

    function switchView(view) {
      uiState.view = view;
      render();
    }

    function render() {
      const t = currentTenant();
      const meta = VIEW_META[uiState.view];
      document.getElementById('pageTitle').textContent = `${meta.title} — ${t.name}`;
      document.getElementById('pageSubtitle').textContent = meta.subtitle;
      document.getElementById('handoffBadge').textContent = String(t.handoffs.length);

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const active = btn.dataset.view === uiState.view;
        btn.classList.toggle('nav-active', active);
        btn.classList.toggle('nav-idle', !active);
      });

      const main = document.getElementById('mainContent');
      if (uiState.view === 'dashboard') main.innerHTML = renderDashboard(t);
      if (uiState.view === 'collections') main.innerHTML = renderCollections(t);
      if (uiState.view === 'intents') main.innerHTML = renderIntents(t);
      if (uiState.view === 'simulator') {
        main.innerHTML = renderSimulator(t);
        const box = document.getElementById('chatMessages');
        if (box) box.scrollTop = box.scrollHeight;
      }
      if (uiState.view === 'handoff') main.innerHTML = renderHandoff(t);
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => switchView(btn.dataset.view));
    });
    document.getElementById('btnQuickSim').addEventListener('click', () => switchView('simulator'));
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalBackdrop').addEventListener('click', e => {
      if (e.target.id === 'modalBackdrop') closeModal();
    });
    document.getElementById('tenantSelect').addEventListener('change', e => {
      uiState.tenantKey = e.target.value;
      uiState.collectionTab = currentTenant().collections[0].id;
      uiState.selectedIntentId = currentTenant().intents[0].id;
      uiState.simProfile = currentTenant().customers[0].id;
      resetSimulator();
      render();
      showToast(`Exibindo agora: ${currentTenant().name}`);
    });
    const inspToggle = document.getElementById('toggleInspector');
    if (inspToggle) {
      inspToggle.addEventListener('change', e => {
        uiState.inspectorOpen = e.target.checked;
        document.body.classList.toggle('show-components', e.target.checked);
        render();
      });
    }
    document.getElementById('mainContent').addEventListener('click', e => {
      const simBtn = e.target.closest('[data-sim-reply]');
      if (simBtn) {
        simReceiveUser(simBtn.dataset.simLabel || '', 'INTERACTIVE_REPLY', simBtn.dataset.simReply || '');
        render();
        const box = document.getElementById('chatMessages');
        if (box) box.scrollTop = box.scrollHeight;
        return;
      }
      const varBtn = e.target.closest('[data-insert-var]');
      if (varBtn) {
        const t = currentTenant();
        const intent = t.intents.find(i => i.id === uiState.selectedIntentId);
        if (!intent) return;
        intent.template = `${intent.template} ${varBtn.dataset.insertVar || ''}`;
        render();
      }
    });

    resetSimulator();
    render();
  </script>
</body>
</html>
